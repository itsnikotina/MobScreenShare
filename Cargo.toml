[workspace]
resolver = "2"
members = ["core", "relay", "desktop"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "1"
url = "2"
log = "0.4"
env_logger = "0.11"
